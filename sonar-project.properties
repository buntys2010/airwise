sonar.projectKey=airwise
sonar.projectName=AirWise
sonar.sources=app,components,lib,mcp
sonar.tests=app,components,lib,mcp,e2e,evals
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**,evals/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,mcp/dist/**,app/globals.css
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Translation tables and guide content are parallel "key": "text" data. Sonar normalises string literals, so it reports
# the English and Hindi entries as clones of each other. They are data, not logic.
sonar.cpd.exclusions=lib/i18n.ts,app/guide/page.tsx
