name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Unused code and duplication
        run: |
          npm run dead
          npm run dupes
          npm run circular
      - name: Tests with coverage floor
        run: npm run coverage
      - run: npm run eval
      - name: Build and check the bundle budget
        run: |
          npm run build 2>&1 | tee build.log
          node scripts/budget.mjs build.log
      - name: Smoke test the production build
        run: |
          npx next start -p 3100 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          # Wait for the health probe instead of a fixed sleep.
          for i in $(seq 1 30); do curl -fs http://localhost:3100/api/health >/dev/null && break; sleep 1; done
          SMOKE_URL=http://localhost:3100 node scripts/smoke.mjs
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm audit --omit=dev --audit-level=high
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: mcp/package-lock.json }
      - run: npm ci
        working-directory: mcp
      - run: npm run build && npm run smoke
        working-directory: mcp
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mcp
