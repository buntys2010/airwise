name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run eval
      - name: Build and check the bundle budget
        run: |
          npm run build 2>&1 | tee build.log
          node scripts/budget.mjs build.log
      - name: Smoke test the production build
        run: |
          npx next start -p 3100 &
          sleep 8
          SMOKE_URL=http://localhost:3100 node scripts/smoke.mjs
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - run: npm audit --omit=dev --audit-level=high
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mcp/package-lock.json }
      - run: npm ci
        working-directory: mcp
      - run: npm run build && npm run smoke
        working-directory: mcp
